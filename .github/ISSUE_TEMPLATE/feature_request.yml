name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions or private APIs involved?
      description: If you know the feature needs a new permission or a private API, say so.
